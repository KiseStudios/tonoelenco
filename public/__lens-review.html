<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><title>Revisão da lente ELENCO</title>
<style>html,body{margin:0;padding:0}iframe{display:block;border:0;height:900px}</style>
<iframe title="ELENCO — revisão da lente" src="/"></iframe>
<script>
const params = new URLSearchParams(location.search);
const width = params.get("width");
const mode = params.get("mode");
const frame = document.querySelector("iframe");
frame.style.width = ["390","820","1440"].includes(width) ? width + "px" : "1440px";
frame.src = mode === "no-webgl" ? "/__lens-no-webgl.html" : mode === "reduced" ? "/__lens-reduced.html" : "/";
</script></html>
