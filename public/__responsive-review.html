<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><title>Revisão institucional ELENCO</title>
<style>html,body{margin:0;padding:0}iframe{display:block;border:0;height:900px}</style>
<iframe title="ELENCO — revisão responsiva" src="/"></iframe>
<script>
const params = new URLSearchParams(location.search);
const width = params.get("width");
const page = params.get("page");
const frame = document.querySelector("iframe");
frame.style.width = ["390","820","1440"].includes(width) ? width + "px" : "1440px";
frame.src = ["sobre","contato","galeria"].includes(page) ? "/" + page : "/";
</script></html>
